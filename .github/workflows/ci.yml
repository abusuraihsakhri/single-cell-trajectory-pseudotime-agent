name: CI

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test,trajectory]"
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents cell_trajectory cli.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
      - name: Browser JavaScript smoke tests
        run: node --test tests/test_web_ui.mjs
      - name: Smoke-test installed CLI
        run: |
          single-cell-trajectory-pseudotime-engine verify-audit
          single-cell-trajectory-pseudotime-engine batch -i sample.csv -o results.csv
          test -s results.csv
