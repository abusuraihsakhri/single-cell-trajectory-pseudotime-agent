[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "single-cell-trajectory-pseudotime-engine"
version = "2.0.1"
description = "Rule-based biomedical metric auditing and experimental trajectory utilities"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

trajectory = ["numpy>=1.24,<3"]

[project.scripts]
single-cell-trajectory-pseudotime-engine = "cli:main"
cell-trajectory-frontier = "cell_trajectory.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/single-cell-trajectory-pseudotime-agent"
Repository = "https://github.com/abusuraihsakhri/single-cell-trajectory-pseudotime-agent"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "cell_trajectory_app"]

[tool.setuptools.packages.find]
include = ["agents*", "cell_trajectory*"]
