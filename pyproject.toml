[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "single-cell-trajectory-pseudotime-engine"
version = "2.0.0"
description = "CellTrajectory Sentinel: Diffusion Pseudotime & Branching Lineage Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
single-cell-trajectory-pseudotime-engine = "cell_trajectory.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/single-cell-trajectory-pseudotime-engine"
Repository = "https://github.com/abusuraihsakhri/single-cell-trajectory-pseudotime-engine.git"
